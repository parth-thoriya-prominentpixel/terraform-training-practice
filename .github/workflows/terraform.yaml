name: Terraform Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action: plan / apply / destroy"
        required: true
        default: "plan"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Verify Required Secrets
        run: |
          echo "🔎 Checking required secrets..."
          test -n "${{ secrets.SSH_PRIVATE_KEY }}" || (echo "❌ Missing SSH_PRIVATE_KEY" && exit 1)
          test -n "${{ secrets.ROLE_ASSUME_ROLE }}" || (echo "❌ Missing ROLE_ASSUME_ROLE" && exit 1)
          test -n "${{ secrets.HCP_TOKEN }}" || (echo "❌ Missing HCP_TOKEN" && exit 1)
          echo "✅ Secrets check passed."

      - name: Setup SSH for Private Modules
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "✅ SSH setup done."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_ASSUME_ROLE }}
          aws-region: us-east-1
      - run: echo "✅ AWS role assumed."

      - name: Terraform Cloud Login
        run: |
          mkdir -p ~/.terraform.d
          cat > ~/.terraform.d/credentials.tfrc.json <<EOF
          {
            "credentials": {
              "app.terraform.io": {
                "token": "${{ secrets.HCP_TOKEN }}"
              }
            }
          }
          EOF
          echo "✅ Terraform Cloud login file created."

      - name: Copy tfvars as auto.tfvars
        run: |
          INPUT_FILE="environments/digiclarity/us-east-1/dev/inputs.tfvars"
          if [ ! -f "$INPUT_FILE" ]; then
            echo "❌ Missing $INPUT_FILE"
            exit 1
          fi
          cp "$INPUT_FILE" resources/inputs.auto.tfvars
          echo "✅ Copied $INPUT_FILE → resources/inputs.auto.tfvars"

      - name: Terraform Init
        working-directory: resources
        run: |
          terraform init -input=false
          echo "✅ Terraform init completed."

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan'
        working-directory: resources
        run: |
          terraform plan -input=false
          echo "✅ Terraform plan completed."

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: resources
        run: |
          terraform apply -auto-approve -input=false
          echo "✅ Terraform apply completed."

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: resources
        run: |
          terraform destroy -auto-approve -input=false
          echo "✅ Terraform destroy completed."
